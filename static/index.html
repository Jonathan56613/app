<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Éclair Live — traqueur de foudre en temps réel</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060A12;
    --panel:#0D1420ee;
    --panel-border:#1B2637;
    --text:#E8EDF5;
    --muted:#64768e;
    --fresh:#F5E642;
    --mid:#FF7A33;
    --old:#8B6BFF;
    --danger:#FF4D4D;
    --ok:#3ddc84;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'IBM Plex Mono', monospace;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
  }
  #map{position:absolute; inset:0; z-index:0;}

  .hud{
    position:absolute; z-index:10;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:10px;
    backdrop-filter: blur(6px);
  }

  #topbar{
    top:14px; left:14px; right:14px;
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 16px;
  }
  #topbar .title{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:18px;
    letter-spacing:0.02em;
    display:flex; align-items:center; gap:10px;
  }
  #topbar .title .bolt{ color:var(--fresh); }
  #status{
    display:flex; align-items:center; gap:8px;
    font-size:12px; color:var(--muted);
  }
  #status .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--danger);
    box-shadow:0 0 8px var(--danger);
  }
  #status .dot.on{ background:var(--ok); box-shadow:0 0 8px var(--ok); }

  .window-toggle{
    display:flex; gap:6px; background:#0009; border-radius:8px; padding:3px;
  }
  .window-toggle button{
    background:transparent; border:none; color:var(--muted);
    font-family:'IBM Plex Mono', monospace; font-size:12px;
    padding:6px 10px; border-radius:6px; cursor:pointer;
  }
  .window-toggle button.active{ background:var(--panel-border); color:var(--text); }

  #nearest{
    top:76px; left:14px; width:230px;
    padding:16px;
  }
  #nearest .label{ font-size:11px; color:var(--muted); letter-spacing:0.08em; text-transform:uppercase;}
  #nearest .distance{
    font-family:'Space Grotesk', sans-serif; font-weight:700;
    font-size:38px; line-height:1.1; margin-top:4px; color:var(--fresh);
  }
  #nearest .distance .unit{ font-size:16px; color:var(--muted); margin-left:4px;}
  #nearest .meta{ margin-top:8px; font-size:12px; color:var(--muted); }

  #panel{
    top:76px; right:14px; bottom:14px; width:290px;
    display:flex; flex-direction:column; overflow:hidden;
  }
  #panel h2{
    font-family:'Space Grotesk', sans-serif; font-size:13px; margin:0;
    padding:14px 16px 10px; letter-spacing:0.06em; color:var(--muted);
    text-transform:uppercase; border-bottom:1px solid var(--panel-border);
  }
  #list{ overflow-y:auto; flex:1; }
  #list::-webkit-scrollbar{ width:6px; }
  #list::-webkit-scrollbar-thumb{ background:var(--panel-border); border-radius:3px; }
  .strike-row{
    padding:10px 16px; border-bottom:1px solid #ffffff08;
    display:flex; justify-content:space-between; align-items:center;
    font-size:12.5px; cursor:pointer;
  }
  .strike-row:hover{ background:#ffffff08; }
  .strike-row .age{ color:var(--muted); }
  .strike-row .dist{ font-weight:600; }
  .age-fresh{ color:var(--fresh); }
  .age-mid{ color:var(--mid); }
  .age-old{ color:var(--old); }

  #empty{
    padding:18px 16px; font-size:12.5px; color:var(--muted);
  }

  .leaflet-control-attribution{ font-size:9px; }

  @media (max-width: 720px){
    #panel{ top:auto; height:38vh; left:14px; right:14px; width:auto; }
    #nearest{ width:auto; right:14px; }
  }
</style>
</head>
<body>

<div id="map"></div>

<div id="topbar" class="hud">
  <div class="title"><span class="bolt">⚡</span> Éclair Live</div>
  <div style="display:flex; align-items:center; gap:14px;">
    <div class="window-toggle" id="windowToggle">
      <button data-h="1">1H</button>
      <button data-h="3" class="active">3H</button>
    </div>
    <div id="status"><span class="dot" id="statusDot"></span><span id="statusText">connexion…</span></div>
  </div>
</div>

<div id="nearest" class="hud">
  <div class="label">Éclair le plus proche</div>
  <div class="distance" id="nearestDistance">—<span class="unit">km</span></div>
  <div class="meta" id="nearestMeta">en attente de position…</div>
</div>

<div id="panel" class="hud">
  <h2 id="panelTitle">Derniers impacts</h2>
  <div id="list"><div id="empty">Aucun éclair détecté pour l'instant dans la fenêtre choisie.</div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const map = L.map('map', { zoomControl:false, attributionControl:true }).setView([46.6, 2.5], 5);
L.control.zoom({ position:'bottomleft' }).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap, &copy; CARTO — données foudre: Blitzortung.org',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

let userPos = null;
let hoursWindow = 3;
const markers = new Map(); // key -> {marker, ts}

function ageBucketColor(ageSec){
  if (ageSec < 5*60) return getComputedStyle(document.documentElement).getPropertyValue('--fresh').trim();
  if (ageSec < 30*60) return getComputedStyle(document.documentElement).getPropertyValue('--mid').trim();
  return getComputedStyle(document.documentElement).getPropertyValue('--old').trim();
}
function ageClass(ageSec){
  if (ageSec < 5*60) return 'age-fresh';
  if (ageSec < 30*60) return 'age-mid';
  return 'age-old';
}
function fmtAge(ageSec){
  if (ageSec < 60) return `${Math.floor(ageSec)}s`;
  if (ageSec < 3600) return `${Math.floor(ageSec/60)}min`;
  const h = Math.floor(ageSec/3600), m = Math.floor((ageSec%3600)/60);
  return `${h}h${m.toString().padStart(2,'0')}`;
}

navigator.geolocation?.getCurrentPosition(
  pos => { userPos = { lat: pos.coords.latitude, lon: pos.coords.longitude }; map.setView([userPos.lat, userPos.lon], 8); },
  () => { document.getElementById('nearestMeta').textContent = "position refusée — impossible de calculer les distances"; },
  { enableHighAccuracy:false, timeout:8000 }
);

document.getElementById('windowToggle').addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  document.querySelectorAll('#windowToggle button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  hoursWindow = parseFloat(btn.dataset.h);
  document.getElementById('panelTitle').textContent = `Impacts — ${hoursWindow}h`;
  refresh();
});

function renderList(strikes){
  const list = document.getElementById('list');
  if (!strikes.length){
    list.innerHTML = `<div id="empty">Aucun éclair détecté pour l'instant dans la fenêtre choisie.</div>`;
    return;
  }
  list.innerHTML = strikes.slice(0, 60).map(s => `
    <div class="strike-row" data-lat="${s.lat}" data-lon="${s.lon}">
      <span class="age ${ageClass(s.age_sec)}">${fmtAge(s.age_sec)}</span>
      <span class="dist">${s.distance_km !== undefined ? s.distance_km.toFixed(1)+' km' : s.lat.toFixed(2)+', '+s.lon.toFixed(2)}</span>
    </div>`).join('');
  list.querySelectorAll('.strike-row').forEach(row=>{
    row.addEventListener('click', ()=> map.flyTo([parseFloat(row.dataset.lat), parseFloat(row.dataset.lon)], 10));
  });
}

function renderMarkers(strikes){
  const seen = new Set();
  for (const s of strikes){
    const key = s.lat.toFixed(4)+','+s.lon.toFixed(4)+','+Math.round(s.age_sec/5);
    seen.add(key);
    if (markers.has(key)) continue;
    const color = ageBucketColor(s.age_sec);
    const m = L.circleMarker([s.lat, s.lon], {
      radius: s.age_sec < 300 ? 7 : 4,
      color, fillColor: color, fillOpacity: 0.85, weight: s.age_sec < 300 ? 2 : 1, opacity:0.9
    }).addTo(map);
    m.bindPopup(`il y a ${fmtAge(s.age_sec)}${s.distance_km!==undefined ? ' · '+s.distance_km.toFixed(1)+' km' : ''}`);
    markers.set(key, m);
  }
  // nettoyage des marqueurs trop vieux (hors fenêtre)
  for (const [key, m] of markers){
    if (!seen.has(key)){ map.removeLayer(m); markers.delete(key); }
  }
}

function renderNearest(strikes){
  const el = document.getElementById('nearestDistance');
  const meta = document.getElementById('nearestMeta');
  if (!userPos){ return; }
  if (!strikes.length || strikes[0].distance_km === undefined){
    el.innerHTML = `—<span class="unit">km</span>`;
    meta.textContent = "aucun impact à proximité";
    return;
  }
  const nearest = strikes[0];
  el.innerHTML = `${nearest.distance_km.toFixed(1)}<span class="unit">km</span>`;
  meta.textContent = `il y a ${fmtAge(nearest.age_sec)}`;
}

async function refresh(){
  try{
    const params = new URLSearchParams({ hours: hoursWindow, limit: 1000 });
    if (userPos){ params.set('lat', userPos.lat); params.set('lon', userPos.lon); }
    const res = await fetch('/api/strikes?' + params.toString());
    const data = await res.json();
    renderMarkers(data.strikes);
    renderList(data.strikes);
    renderNearest(data.strikes);

    const st = await (await fetch('/api/status')).json();
    document.getElementById('statusDot').classList.toggle('on', st.connected);
    document.getElementById('statusText').textContent = st.connected
      ? `connecté · ${st.strikes_in_memory} en mémoire`
      : 'reconnexion…';
  } catch(e){
    document.getElementById('statusText').textContent = 'erreur réseau';
  }
}

refresh();
setInterval(refresh, 8000);
</script>
</body>
</html>
